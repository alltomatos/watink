# Watink — Full Stack Development Environment
# Usage: docker compose -f docker-compose.dev.yml up --build
#
# This compose file mirrors the production architecture but with dev-friendly
# settings: source mounts for hot-reload, exposed debug ports, and seeded DB.

services:
  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────

  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    container_name: watink-postgres
    environment:
      POSTGRES_DB: watink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:-watink_secret_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - watink_net

  redis:
    image: redis:7-alpine
    container_name: watink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - watink_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: watink-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - watink_net

  # ──────────────────────────────────────────────
  # Application Services
  # ──────────────────────────────────────────────

  watink-business:
    build:
      context: ./business
      dockerfile: Dockerfile.dev
    container_name: watink-business
    ports:
      - "8082:8082"
    environment:
      - PORT_GO=8082
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=${DB_PASS:-watink_secret_pass}
      - DB_NAME=watink
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
      - ENGINE_HEALTH_URL=http://watink-engine:8083/health
      # API interna de grupos/comunidades (T2.2) — mesmo host docker-interno
      # do watink-engine, nunca exposta fora da rede (ver watink-engine.expose acima).
      - GROUPS_API_URL=http://watink-engine:8084
      - GROUPS_API_TOKEN=${GROUPS_API_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_change_in_prod}
      # Chave de criptografia-at-rest das senhas de proxy (AES-GCM via SHA-256).
      # PROD: defina PROXY_ENC_KEY (ex: openssl rand -base64 32). Trocar a chave
      # invalida segredos já gravados — re-importe os proxies.
      - PROXY_ENC_KEY=${PROXY_ENC_KEY:-dev_proxy_enc_key_change_in_prod}
      - DOCS_PUBLIC=${DOCS_PUBLIC:-false}
      # PLUGIN_MANAGER_URL não é configurável: fixa em código
      # (business/internal/pluginlicense/client.go) como http://plugin-manager:8081,
      # de propósito — ver comentário na constante pluginManagerBaseURL.
      # Dev: o gateway de IA (omniroute) roda no host em localhost:20128; de dentro
      # do container isso vira host.docker.internal (aiclient.rewriteDevHost).
      - AI_BASEURL_HOST_REWRITE=host.docker.internal
      # Token do control plane Watink SaaS (Trilha A, docs/integration-core.md §1).
      # Fail-closed: vazio → /api/v1/internal/saas/* responde 503 e nada muda para
      # quem não usa o SaaS. Segredo distinto do INTERNAL_TOKEN (blast radius
      # separado); cada instância define o SEU. NÃO commitar o valor real.
      - SAAS_INTERNAL_TOKEN=${SAAS_INTERNAL_TOKEN:-}
      # Canal REVERSO core→SaaS do registro self-service (Onda 6, ADR 0007). As
      # três precisam estar setadas para o botão "Registrar-se" aparecer — sem
      # elas o grupo /api/v1/register/* nem é montado (fail-closed). Reusa o
      # MESMO token acima (par simétrico do X-Internal-Token inbound/outbound).
      - SAAS_BASE_URL=${SAAS_BASE_URL:-}
      - SAAS_INSTANCE_ID=${SAAS_INSTANCE_ID:-}
      # CAPTCHA (Cloudflare Turnstile) do formulário de registro público — vazio
      # em dev pula a verificação (nunca em produção com o segredo presente).
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - S3_ENDPOINT=minio:9000
      - S3_BUCKET=watink-knowledge
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_USE_SSL=false
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./business:/app
      - business_go_mod:/go/pkg/mod
      - business_go_cache:/root/.cache/go-build
      - uploads_data:/app/public
      - sessions_data:/app/.sessions_auth
    networks:
      - watink_net
    restart: unless-stopped

  watink-engine:
    build:
      context: ./engine-go
      dockerfile: Dockerfile.dev
    container_name: watink-engine
    # Public DNS resolvers — Docker's embedded resolver (127.0.0.11) intermittently
    # fails to resolve web.whatsapp.com ("server misbehaving"), breaking reconnects.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8083:8083"
    # API interna de grupos/comunidades (T1.1) — NUNCA "ports:", só "expose:"
    # (invariant 2 do plano "Grupos e Comunidades"): nunca sai da rede docker.
    expose:
      - "8084"
    environment:
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=${DB_PASS:-watink_secret_pass}
      - DB_NAME=watink
      - HEALTH_PORT=8083
      - GROUPS_API_PORT=8084
      - GROUPS_API_TOKEN=${GROUPS_API_TOKEN:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./engine-go:/app
      - engine_go_mod:/go/pkg/mod
      - engine_go_cache:/root/.cache/go-build
      - engine_sessions:/root/.sessions_auth
    networks:
      - watink_net
    restart: unless-stopped

  plugin-manager:
    # Componente PROPRIETÁRIO (ADR 0024) — fonte no repo privado
    # alltomatos/watink-plugin-manager, distribuído APENAS como imagem compilada
    # (GHCR). O core NÃO builda do source e NÃO expõe forma de trocar a imagem
    # ou o endpoint do Hub: é a trava real de licenciamento, fonte fechado, tag
    # fixa. Desenvolvimento do plugin-manager em si acontece só dentro do
    # próprio repo privado, fora deste compose.
    image: ghcr.io/alltomatos/watink-plugin-manager:latest
    container_name: watink-plugin-manager
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - HUB_URL=
      # PM_ENV=dev libera o modo stub de dev (fail-open, active/tenantCap=0
      # p/ knownPluginSlugs) sem HUB_URL — sem isto, PM_ENV default é
      # "production" e o boot falha (fatal) sem HUB_URL configurado.
      - PM_ENV=dev
    volumes:
      - plugin_manager_data:/data
    networks:
      - watink_net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Frontend (standalone — only if NOT using the
  # embedded frontend inside watink-business)
  # Uncomment the block below for isolated frontend dev.
  # ──────────────────────────────────────────────

  frontend:
    image: node:20-alpine
    container_name: watink-frontend
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Volume anônimo para node_modules: evita que o bind mount do host sobreescreva
      # os módulos compilados para Linux dentro do container
      - frontend_node_modules:/app/node_modules
    environment:
      # VITE_BACKEND_URL vazio no browser (same-origin via proxy Vite).
      # BACKEND_PROXY_TARGET é usado APENAS pelo proxy server-side do Vite para
      # encaminhar /api/* para o container do backend na rede Docker.
      - BACKEND_PROXY_TARGET=http://watink-business:8082
      # SSE vai direto para o backend (sem passar pelo proxy Vite) porque usa JWT
      # no URL (sem cookie), então SameSite não é um problema. Isso evita que o
      # proxy Vite mate as conexões longas de SSE por timeout interno.
      - VITE_SSE_URL=http://127.0.0.1:8082
      # Polling para HMR funcionar com volumes Docker no Windows
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_POLL_INTERVAL=300
      - WATCHPACK_POLLING=true
    depends_on:
      - watink-business
    networks:
      - watink_net
    restart: on-failure
    stop_grace_period: 10s

  # Ollama — embedding self-hosted para a Base de Conhecimento (RAG). OPT-IN:
  # só sobe com `docker compose --profile ollama up -d` (não no `up` padrão).
  # Alternativa ao embedding via omniroute/naga: local, grátis, privado, sem créditos.
  # Aponte o embedding via setting `aiEmbeddingBaseURL=http://ollama:11434/v1` (chat
  # segue no omniroute). ⚠️ EM CPU é LENTO para modelos médios/grandes (medido:
  # ~21s/chunk bge-m3, ~50s/chunk qwen3:4b num chunk de ~512 tok) — viável só com
  # modelo pequeno (nomic-embed-text ~4s/chunk) ou, idealmente, com GPU. Modelos:
  # `docker exec watink-ollama ollama pull <modelo>`.
  ollama:
    image: ollama/ollama:latest
    container_name: watink-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - watink_net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: watink-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - watink_net
    restart: unless-stopped

networks:
  watink_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  sessions_data:
  engine_sessions:
  engine_go_mod:
  engine_go_cache:
  business_go_mod:
  business_go_cache:
  ollama_models:
  minio_data:
  frontend_node_modules:
    # node_modules do frontend ficam isolados no container (binários Linux)
    # O bind mount ./frontend:/app cobre o código-fonte; este volume "sombra"
    # /app/node_modules para que npm install dentro do container não conflite
    # com node_modules do Windows no host.
  plugin_manager_data:
