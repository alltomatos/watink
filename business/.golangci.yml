version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
  settings:
    misspell:
      # "Clientes"/"clientes" é o nome do domínio (módulo CRM, ADR 0023) —
      # não é typo de "clients", aparece de propósito em descrições de
      # permissão, comentários e Swagger. Exclusão global em vez de
      # reescrever cada ocorrência (ao contrário de comentários isolados,
      # este termo recorre por toda a feature).
      ignore-rules:
        - clientes
        - Clientes
        # "protocolo(s)" é o domínio do plugin Helpdesk (ADR 0024, CRUD de
        # atendimento) — mesma justificativa de "Clientes" acima: recorre
        # por toda a feature (models, handlers, comentários), não é typo
        # isolado de "protocols".
        - protocolo
        - Protocolo
        - protocolos
        - Protocolos
        # "participantes"/"momento" são português comum (módulo Grupos e
        # Comunidades — plugin de gestão de grupos WhatsApp) e disparam
        # falso positivo do dicionário en-US do misspell ("participants",
        # "memento") — não são typos.
        - participante
        - Participante
        - participantes
        - Participantes
        - momento
        - Momento
        - independente
        - Independente
        # Português comum do módulo Atividades (ADR 0029) que colide com o
        # dicionário en-US do misspell — "validade" ~ "validated",
        # "progresso" ~ "progression", "informativo" ~ "information". Não
        # são typos.
        - validade
        - Validade
        - progresso
        - Progresso
        - informativo
        - Informativo
        # "presente(s)" é português comum (Modo SaaS, services/saas_contract_
        # service.go) e colide com o dicionário en-US do misspell
        # ("presents") — não é typo.
        - presente
        - Presente
        - presentes
        - Presentes
        # "resolvendo" é português comum (Modo SaaS, middleware/
        # internal_saas.go) e colide com o dicionário en-US do misspell
        # ("resolved") — não é typo.
        - resolvendo
        - Resolvendo
        # "comando(s)"/"corporativo" são português comum (Modo SaaS, worker
        # de sync — issue #631) e colidem com o dicionário en-US do misspell
        # ("commando(s)", "corporation") — não são typos.
        - comando
        - Comando
        - comandos
        - Comandos
        - corporativo
        - Corporativo
        # "suspenso" é português comum (middleware/tenant_status.go, Onda 2 do
        # watink-saas) e colide com o dicionário en-US do misspell
        # ("suspension") — não é typo.
        - suspenso
        - Suspenso
        # "anual" é português comum (pluginlicense.CatalogPlugin — ciclos de
        # recorrência mensal/anual do catálogo do Hub) e colide com o
        # dicionário en-US do misspell ("annual") — não é typo.
        - anual
        - Anual
