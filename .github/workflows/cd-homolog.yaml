name: CD Homolog

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata backend
        id: meta-backend
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-business
          tags: |
            type=sha,prefix=homolog-

      - name: Docker metadata frontend
        id: meta-frontend
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=homolog-

      - name: Build and push backend
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile.business
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend/
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  # deploy-homolog builda a partir do source já atualizado direto na VPS (o
  # mesmo processo manual já usado antes desta automação) -- não depende das
  # imagens publicadas em build-and-push, que existem só como rastro/
  # auditoria de cada commit no GHCR, não como fonte do deploy.
  #
  # Project name do Compose é `app` (NÃO "watink-homolog") -- é o nome
  # default que o stack já usava antes desta automação (diretório
  # /opt/watink/app, sem `-p` explícito nos deploys manuais anteriores). Usar
  # um nome diferente aqui criaria um SEGUNDO stack do zero (volumes vazios,
  # sem os dados existentes) e colidiria de porta com o original -- foi
  # exatamente isso que quebrou a primeira tentativa deste workflow.
  deploy-homolog:
    name: deploy-homolog
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: homolog-ssh

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOMOLOG_SSH_HOST }}
          username: ${{ secrets.HOMOLOG_SSH_USER }}
          key: ${{ secrets.HOMOLOG_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/watink/app
            git fetch origin develop
            git reset --hard origin/develop
            docker compose -p app -f docker-compose.prod.yml --env-file .env build --pull
            docker compose -p app -f docker-compose.prod.yml --env-file .env up -d

  smoke-tests:
    name: smoke-tests
    runs-on: ubuntu-latest
    needs: deploy-homolog

    steps:
      - name: API Health
        env:
          HOMOLOG_URL: ${{ secrets.HOMOLOG_URL }}
        run: |
          URL="${HOMOLOG_URL:-https://homolog.watink.com}"
          echo "Checking API health at $URL/api/health"
          curl --fail --retry 5 --retry-delay 10 --retry-connrefused \
            "$URL/api/health" || exit 1
