name: CD Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata backend
        id: meta-backend
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-business
          tags: |
            type=sha,prefix=prod-

      - name: Docker metadata frontend
        id: meta-frontend
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=prod-

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.business
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend/
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  # deploy-production builda a partir do source já atualizado direto na VPS,
  # no clone separado de produção (/opt/watink/app-prod, branch main) -- o
  # mesmo mecanismo do deploy-homolog, mas isolado por diretório, project
  # name (`-p watink-prod`) e `.env.prod` próprio. Nunca compartilha banco,
  # Redis, RabbitMQ nem segredos com o stack de homolog, mesmo rodando na
  # mesma VPS.
  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production-ssh

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/watink/app-prod
            git fetch origin main
            git reset --hard origin/main
            docker compose -p watink-prod -f docker-compose.prod.yml --env-file .env.prod build --pull
            # pull explícito só do plugin-manager: é o único serviço image:-only
            # SEM build: neste stack (proprietário — ver CLAUDE.md); um `pull` sem
            # filtro tenta puxar watink/business:prod e watink/engine:prod também,
            # que só existem localmente (buildados acima) e não em nenhum registry
            # — isso derruba o deploy inteiro. Sem esta linha, `up -d` nunca
            # atualiza plugin-manager mesmo com :latest novo no Docker Hub, porque
            # o pull_policy default só busca a imagem quando ela está ausente.
            docker compose -p watink-prod -f docker-compose.prod.yml --env-file .env.prod pull plugin-manager
            docker compose -p watink-prod -f docker-compose.prod.yml --env-file .env.prod up -d

  smoke-tests:
    name: smoke-tests
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: API Health
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          URL="${PROD_URL:-https://app.watink.com}"
          echo "Checking API health at $URL/api/health"
          curl --fail --retry 5 --retry-delay 10 --retry-connrefused \
            "$URL/api/health" || exit 1
